# ===== ClaudeBridge =====
# Как позвать Claude в чате — сообщение начинается с любого из этих имён
# (с @ или без, большими или маленькими буквами):
#   клауд построй домик   /   @Claude сделай день   /   Клод, выдай алмазы
names:
  - claude
  - claud
  - clode
  - клауд
  - клауде
  - клод
  - клоуд

# Кто может звать Claude (ники Minecraft). Остальных он не слушает.
allowed-players:
  - GriGold

# Путь к программе Claude Code.
# Обычно хватает просто claude. Если в чате пишет "не нашёл программу",
# узнай путь командой в PowerShell:  where.exe claude
# и вставь его сюда, например:  C:\Users\Administrator\.local\bin\claude.exe
claude-path: "claude"

# Модель (можно оставить пустым — будет модель по умолчанию из твоей подписки)
model: ""

# Дополнительные параметры запуска claude (для опытных, можно не трогать)
extra-args: []

# Сколько секунд ждать ответ
timeout-seconds: 180

# Максимум команд за одну просьбу
max-commands: 1000

# Скрывать ответы команд ("Заполнено 100 блоков" и т.п.) из консоли и от операторов
hide-command-output: true

# Сколько команд выполнять за один тик (меньше = меньше лагов, но строит дольше)
commands-per-tick: 50

# Команды, которые Claude НЕЛЬЗЯ выполнять (если в сообщении нет секретного кода)
blocked-commands:
  - op
  - deop
  - stop
  - restart
  - reload
  - ban
  - ban-ip
  - pardon
  - pardon-ip
  - kick
  - whitelist
  - save-off
  - save-all
  - debug
  - perf
  - jfr
  - transfer
  - plugins
  - pl
  - lp
  - luckperms
  - pex
  - claude

# Если команда содержит любое из этих слов — она тоже блокируется
blocked-words:
  - command_block
  - command_block_minecart
